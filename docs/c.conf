# A C syntax highlighter authored as a vedit FSM grammar.
#
# Use it as your config directly (VEDIT_CONFIG=/path/to/c.conf vedit file.c),
# or paste these sections into your own config (for example ~/.veditrc). It
# defines a language named "c" and maps the usual C and C++ file extensions to
# it. Being named "c", it also replaces the built-in C highlighter for .c files.
#
# The model is joe's: a set of states, each with ordered transition rules keyed
# on a character set. The carry state between lines is the current state, so a
# block comment spans lines by staying in its state at end of line. A virtual
# newline is fed at the end of each line, so a line comment returns to idle with
# a "\n" rule.

[language "c"]
	start = idle

[syntax]
	h   = c
	cc  = c
	cpp = c
	cxx = c
	hpp = c
	hh  = c
	i   = c
	lpc = c

# class -> color [attrs]; quote the #rrggbb values so '#' is not a comment.
[color "c"]
	comment = "#6a9955"
	string  = "#ce9178"
	char    = "#ce9178"
	number  = "#b5cea8"
	keyword = "#569cd6"
	type    = "#4ec9b0"
	preproc = "#c586c0"

[words "c.keywords"]
	list = if else while for do switch case default break continue
	list = return goto sizeof typedef struct union enum
	list = static const extern volatile register inline auto restrict
	list = asm __asm__ __inline__ __attribute__ __restrict
	list = true false NULL

[words "c.types"]
	list = void char short int long float double signed unsigned
	list = bool _Bool size_t ssize_t ptrdiff_t wchar_t FILE va_list
	list = int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t
	list = intptr_t uintptr_t
	list = u8 u16 u32 u64 s8 s16 s32 s64 __u8 __u16 __u32 __u64
	list = gfp_t loff_t dma_addr_t atomic_t spinlock_t

[state "c.idle"]
	color = text
	rule = "/"        slash
	rule = "\""       string  recolor
	rule = "'"        char    recolor
	rule = "0-9"      number  recolor
	rule = "a-zA-Z_"  ident   buffer
	rule = "#"        preproc recolor
	rule = *          idle

# After a '/': start a comment, otherwise it was a division operator.
[state "c.slash"]
	color = text
	rule = "/"  lcomment recolor=2
	rule = "*"  bcomment recolor=2
	rule = *    idle     noeat

[state "c.lcomment"]
	color = comment
	rule = "\n"  idle
	rule = *     lcomment

[state "c.bcomment"]
	color = comment
	rule = "*"  bstar
	rule = *    bcomment

# Saw a '*' inside a block comment: a following '/' closes it. The closing '/'
# is eaten in this state, so it keeps the comment color (no recolor needed).
[state "c.bstar"]
	color = comment
	rule = "/"  idle
	rule = "*"  bstar
	rule = *    bcomment

[state "c.string"]
	color = string
	rule = "\\"  sesc
	rule = "\""  idle
	rule = "\n"  idle
	rule = *     string

[state "c.sesc"]
	color = string
	rule = *  string

[state "c.char"]
	color = char
	rule = "\\"  cesc
	rule = "'"   idle
	rule = "\n"  idle
	rule = *     char

[state "c.cesc"]
	color = char
	rule = *  char

[state "c.number"]
	color = number
	rule = "0-9a-fA-F.xXuUlLeE"  number
	rule = *                     idle  noeat

# An identifier; on the closing boundary, match it against the keyword and type
# word lists and recolor the whole token on a hit.
[state "c.ident"]
	color = text
	rule = "a-zA-Z0-9_"  ident
	rule = *             idle  noeat  kw=c.keywords:keyword  kw=c.types:type

[state "c.preproc"]
	color = preproc
	rule = "\n"  idle
	rule = *     preproc
