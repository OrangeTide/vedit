# A spooky Halloween theme for vedit: pumpkin orange, blood red, and witch
# purple over the greys and light blacks of a dark editor. It leans on the
# layout of Solarized Dark (a low-contrast dark base with accent colors) but
# trades the teal palette for Halloween colors.
#
# This is an example config, not built into the editor. To use it, add to your
# own config (see docs/05-configuration.md):
#
#     [include]
#         path = /path/to/examples/halloween.conf
#
# The include both defines the theme and selects it. The colors are 256-palette
# indices, so a 256-color terminal shows them as written; on a 16-color terminal
# vedit maps each to the nearest ANSI color, so the theme still works, just with
# fewer shades.

[ui]
    scheme = halloween

# The editor chrome: borders, bars, the status line, the text area.
[theme "halloween"]
    base           = black     # start from the dark preset, then recolor
    content.fg     = 250        # bone grey text
    content.bg     = 234        # a light black, the night sky
    frame.fg       = 240        # dim grey borders and scrollbars
    frame.bg       = 234
    title.fg       = 214        # the filename in pumpkin
    bar.fg         = 223        # pale bone on the menu and status bars
    bar.bg         = 236        # graveyard grey
    guide.fg       = 238        # faint tab guides
    status.mode.fg = 234        # dark text on the colored mode flag
    status.normal  = 141        # NORMAL: witch purple
    status.insert  = 71         # INSERT: toxic green
    status.visual  = 208        # VISUAL: pumpkin
    status.draw    = 170        # DRAW: magenta
    status.edit    = 166        # modeless keys: ember orange
    status.a.fg    = 234
    status.a.bg    = 208        # segment A: pumpkin (F1=Help, position)
    status.b.fg    = 223
    status.b.bg    = 54         # segment B: deep purple (branch, endings)
    status.c.fg    = 250
    status.c.bg    = 236        # segment C: grey (view flags)

# Syntax colors. A [color "lang"] section with no grammar of its own recolors
# the built-in grammar, so these just restyle the shipped languages. The scheme:
# pumpkin keywords, purple types, green strings, amber numbers, blood-red
# preprocessor and deletions, tombstone-grey comments.
[color "c"]
    comment = 244               # tombstone grey
    string  = 71                # toxic green
    char    = 71
    number  = 214               # amber
    keyword = 208 bold          # pumpkin
    type    = 141               # witch purple
    preproc = 160               # blood red

[color "javascript"]
    comment = 244
    string  = 71
    number  = 214
    keyword = 208 bold
    type    = 141

[color "html"]
    tag     = 208 bold          # pumpkin tags
    attr    = 141               # purple attributes
    string  = 71
    comment = 244
    entity  = 214
    doctype = 160

[color "sh"]
    comment  = 244
    string   = 71
    keyword  = 208 bold
    variable = 214              # amber $vars

[color "md"]
    heading   = 208 bold        # pumpkin headings
    bold      = 252 bold
    italic    = 141 italic
    code      = 71
    codeblock = 71
    quote     = 244
    link      = 177 underline   # light purple links
    url       = 177

[color "ini"]
    section = 208 bold
    key     = 141
    value   = 71
    string  = 71
    comment = 244

[color "diff"]
    add    = 71                 # green additions
    del    = 160                # red deletions
    hunk   = 141                # purple hunk markers
    header = 214 bold           # amber file headers

[color "gitcommit"]
    subject = 208 bold          # pumpkin subject line
    over    = 160 reverse       # blood red past the column limit
    comment = 244

[color "blame"]
    rev  = 141                  # purple revisions
    meta = 244
