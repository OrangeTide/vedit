# Emacs keymap for vedit, a simple subset of the GNU Emacs keys.
#
# This is an example config, not built into the editor. To use it, add to your
# own config (see docs/05-configuration.md):
#
#     [include]
#         path = /path/to/examples/emacs.conf
#     [keys]
#         modes = msedit emacs
#
# Then F2 cycles into "emacs". The mode is modeless: printable keys insert
# text, and only the keys bound below do anything else. ^X is a prefix: press
# it and then the second key, with or without Ctrl held, so ^X ^S and ^X S both
# save.
#
# What is not here: Emacs puts many commands on Meta (Alt), such as M-f, M-w,
# and M-x. vedit has no Meta bindings, and Alt plus a letter opens the menu
# bar, so those keys are left out. ^W (kill-region) is the window prefix in
# vedit and cannot be rebound, so select with Shift and the motion keys and use
# the menu or the arrow keys when a Meta command is wanted.

[keys "emacs"]
	# text entry (a custom keymap starts with no keys at all)
	bind = enter	newline
	bind = bksp	delete-left
	bind = tab	tab
	bind = del	delete-right

	# motion (the Emacs control keys)
	bind = ^F	right
	bind = ^B	left
	bind = ^P	up
	bind = ^N	down
	bind = ^A	line-begin
	bind = ^E	line-end
	bind = ^V	page-down		# scroll-up is on the menu or PgUp

	# arrow and navigation keys
	bind = up	up
	bind = down	down
	bind = left	left
	bind = right	right
	bind = home	line-begin
	bind = end	line-end
	bind = pgup	page-up
	bind = pgdn	page-down

	# editing
	bind = ^D	delete-right		# delete-char
	bind = ^K	delete-to-eol		# kill-line
	bind = ^O	split-line		# open-line, cursor stays
	bind = ^Y	paste			# yank
	bind = ^S	find			# isearch-forward
	bind = ins	overtype-toggle		# overwrite-mode

	# ^X  the extend prefix
	bind = ^X S	save			# C-x C-s save-buffer
	bind = ^X W	save-as			# C-x C-w write-file
	bind = ^X C	quit			# C-x C-c quit
	bind = ^X I	file-insert		# C-x i insert-file
	bind = ^X U	undo			# C-x u undo
	bind = ^X G	goto-line		# go to a line number
	bind = ^X R	replace			# query-replace (Emacs M-%)
	bind = ^X <	file-top		# beginning-of-buffer (Emacs M-<)
	bind = ^X >	file-bottom		# end-of-buffer (Emacs M->)

	# Registers and places. Emacs puts these on the three-key C-x r prefix
	# (C-x r SPC, C-x r j, C-x r s, C-x r i); vedit chords are two keys, so
	# they move onto ^X with the register letter kept in mind. A place is
	# stored in mark p and text in register r, which vi shares, so a region
	# stashed here pastes with vi's "rp. A place mark follows its text
	# through edits, so a jump still lands where the text moved to.
	bind = ^X P	{ mark p [cursor] }	# point-to-register (C-x r SPC)
	bind = ^X J	{ go [mark p] }		# jump-to-register (C-x r j)
	bind = ^X Y	{ copy [region char [mark p] [cursor]] [reg r] }  # copy place..point (C-x r s)
	bind = ^X V	{ put [reg r] at [cursor] }	# insert-register (C-x r i)

	# F1 shows this mode's keys. Emacs help is C-h, but a terminal sends
	# that as Backspace, so help is on F1 here.
	bind = f1	help

	# Help shown on F1 while this keymap is active. One line each,
	# displayed verbatim, so this file is a complete personality on its own.
	help = "Emacs keys (a simple subset)"
	help = ""
	help = "  Move    ^F right  ^B left  ^P up  ^N down"
	help = "          ^A line start  ^E line end  ^V page down"
	help = "  Edit    ^D delete char  ^K kill to end of line  ^O open line"
	help = "          ^Y yank (paste)  Ins overwrite mode"
	help = "  Search  ^S find  ^X R replace"
	help = "  Extend  ^X S save  ^X W write-file  ^X C quit"
	help = "          ^X I insert file  ^X U undo  ^X G go to line"
	help = "          ^X < top of file  ^X > end of file"
	help = "  Place   ^X P mark place  ^X J jump to it"
	help = "  Register ^X Y copy place..point  ^X V insert it"
	help = ""
	help = "  Meta (Alt) keys are not bound. Select with Shift and motion."
