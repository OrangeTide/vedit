# WordStar keymap for vedit, for prose and long-form writing.
#
# This is an example config, not built into the editor. To use it, add to your
# own config (see docs/05-configuration.md):
#
#     [include]
#         path = /path/to/examples/wordstar.conf
#     [keys]
#         modes = msedit wordstar
#
# Then F2 cycles into "wordstar". The mode is modeless: printable keys insert
# text, and only the keys bound below do anything else. Press a prefix (^K, ^Q,
# ^O) and then the second key, with or without Ctrl held.
#
# The onscreen-format keys for centering and margins (^OC, ^OL, ^OR) wait on a
# later patch; until then they do nothing. The rest work.

[keys "wordstar"]
	# text entry (a custom keymap starts with no keys at all)
	bind = enter	newline
	bind = bksp	delete-left
	bind = tab	tab

	# cursor diamond
	bind = ^E	up
	bind = ^X	down
	bind = ^S	left
	bind = ^D	right
	bind = ^A	word-left
	bind = ^F	word-right
	bind = ^R	page-up
	bind = ^C	page-down
	bind = ^W	scroll-up		# view up a line, cursor stays
	bind = ^Z	scroll-down

	# arrow and navigation keys
	bind = up	up
	bind = down	down
	bind = left	left
	bind = right	right
	bind = home	line-begin
	bind = end	line-end
	bind = pgup	page-up
	bind = pgdn	page-down

	# deletions
	bind = ^G	delete-right
	bind = del	delete-right
	bind = ^T	delete-word-right
	bind = ^Y	delete-line

	# editing
	bind = ^V	overtype-toggle
	bind = ^N	split-line		# break the line, cursor stays
	bind = ^B	reflow			# reformat the paragraph
	bind = ^L	find-next
	bind = ^U	undo
	bind = ^J	help

	# ^Q  quick movement
	bind = ^Q S	line-begin
	bind = ^Q D	line-end
	bind = ^Q E	screen-top
	bind = ^Q X	screen-bottom
	bind = ^Q R	file-top
	bind = ^Q C	file-bottom
	bind = ^Q F	find
	bind = ^Q A	replace
	bind = ^Q Y	delete-to-eol
	bind = ^Q del	delete-to-bol
	bind = ^Q P	jump-back
	bind = ^Q B	block-goto-begin
	bind = ^Q K	block-goto-end
	bind = ^Q I	goto-line
	bind = ^Q 0	marker-goto 0
	bind = ^Q 1	marker-goto 1
	bind = ^Q 2	marker-goto 2
	bind = ^Q 3	marker-goto 3
	bind = ^Q 4	marker-goto 4
	bind = ^Q 5	marker-goto 5
	bind = ^Q 6	marker-goto 6
	bind = ^Q 7	marker-goto 7
	bind = ^Q 8	marker-goto 8
	bind = ^Q 9	marker-goto 9

	# ^K  block
	bind = ^K B	block-begin
	bind = ^K K	block-end
	bind = ^K C	block-copy		# copy the block to the cursor
	bind = ^K V	block-move		# move the block to the cursor
	bind = ^K Y	block-delete
	bind = ^K H	block-hide		# show or hide the block highlight
	bind = ^K N	block-column-toggle
	bind = ^K W	block-write		# write the block to a file
	bind = ^K R	file-insert		# read a file in at the cursor
	bind = ^K S	save
	bind = ^K D	save-exit
	bind = ^K X	save-exit
	bind = ^K Q	quit
	bind = ^K 0	marker-set 0
	bind = ^K 1	marker-set 1
	bind = ^K 2	marker-set 2
	bind = ^K 3	marker-set 3
	bind = ^K 4	marker-set 4
	bind = ^K 5	marker-set 5
	bind = ^K 6	marker-set 6
	bind = ^K 7	marker-set 7
	bind = ^K 8	marker-set 8
	bind = ^K 9	marker-set 9

	# ^O  onscreen format
	bind = ^O W	wrap-toggle
	bind = ^O C	center-line
	bind = ^O L	left-margin
	bind = ^O R	right-margin
