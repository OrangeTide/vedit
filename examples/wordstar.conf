# WordStar keymap for vedit, for prose and long-form writing.
#
# This is an example config, not built into the editor. To use it, add to your
# own config (see docs/05-configuration.md):
#
#     [include]
#         path = /path/to/examples/wordstar.conf
#     [keys]
#         modes = msedit wordstar
#
# Then F2 cycles into "wordstar". The mode is modeless: printable keys insert
# text, and only the keys bound below do anything else. Press a prefix (^K, ^Q,
# ^O) and then the second key, with or without Ctrl held.

[keys "wordstar"]
	# text entry (a custom keymap starts with no keys at all)
	bind = enter	newline
	bind = bksp	delete-left
	bind = tab	tab

	# cursor diamond
	bind = ^E	up
	bind = ^X	down
	bind = ^S	left
	bind = ^D	right
	bind = ^A	word-left
	bind = ^F	word-right
	bind = ^R	page-up
	bind = ^C	page-down
	bind = ^W	scroll-up		# view up a line, cursor stays
	bind = ^Z	scroll-down

	# arrow and navigation keys
	bind = up	up
	bind = down	down
	bind = left	left
	bind = right	right
	bind = home	line-begin
	bind = end	line-end
	bind = pgup	page-up
	bind = pgdn	page-down

	# deletions
	bind = ^G	delete-right
	bind = del	delete-right
	bind = ^T	delete-word-right
	bind = ^Y	delete-line

	# editing
	bind = ^V	overtype-toggle
	bind = ^N	split-line		# break the line, cursor stays
	bind = ^B	reflow			# reformat the paragraph
	bind = ^L	find-next
	bind = ^U	undo
	bind = f1	help		# ^J is the WordStar help key, but a terminal
					# sends it as Enter, so help is on F1 here

	# ^Q  quick movement
	bind = ^Q S	line-begin
	bind = ^Q D	line-end
	bind = ^Q E	screen-top
	bind = ^Q X	screen-bottom
	bind = ^Q R	file-top
	bind = ^Q C	file-bottom
	bind = ^Q F	find
	bind = ^Q A	replace
	bind = ^Q Y	delete-to-eol
	bind = ^Q del	delete-to-bol
	bind = ^Q P	jump-back
	bind = ^Q B	block-goto-begin
	bind = ^Q K	block-goto-end
	bind = ^Q I	goto-line
	bind = ^Q 0	marker-goto 0
	bind = ^Q 1	marker-goto 1
	bind = ^Q 2	marker-goto 2
	bind = ^Q 3	marker-goto 3
	bind = ^Q 4	marker-goto 4
	bind = ^Q 5	marker-goto 5
	bind = ^Q 6	marker-goto 6
	bind = ^Q 7	marker-goto 7
	bind = ^Q 8	marker-goto 8
	bind = ^Q 9	marker-goto 9

	# ^K  block
	bind = ^K B	block-begin
	bind = ^K K	block-end
	bind = ^K C	block-copy		# copy the block to the cursor
	bind = ^K V	block-move		# move the block to the cursor
	bind = ^K Y	block-delete
	bind = ^K H	block-hide		# show or hide the block highlight
	bind = ^K N	block-column-toggle
	bind = ^K W	block-write		# write the block to a file
	bind = ^K R	file-insert		# read a file in at the cursor
	# ^K R reads a file from disk; this reads the second file already open
	# as a buffer in at the cursor, which the command language makes reach
	# across open files. 999 clamps to that file's last line.
	bind = "^K G { copy [region line 1 999 file 2] [reg x] ; put [reg x] at [cursor] }"
	bind = ^K S	save
	bind = ^K D	save-exit
	bind = ^K X	save-exit
	bind = ^K Q	quit
	bind = ^K 0	marker-set 0
	bind = ^K 1	marker-set 1
	bind = ^K 2	marker-set 2
	bind = ^K 3	marker-set 3
	bind = ^K 4	marker-set 4
	bind = ^K 5	marker-set 5
	bind = ^K 6	marker-set 6
	bind = ^K 7	marker-set 7
	bind = ^K 8	marker-set 8
	bind = ^K 9	marker-set 9

	# ^O  onscreen format
	bind = ^O W	wrap-toggle
	bind = ^O C	center-line
	bind = ^O L	left-margin
	bind = ^O R	right-margin

	# Help shown on F1 while this keymap is active. One line each,
	# displayed verbatim, so this file is a complete personality on its own.
	help = "WordStar keys"
	help = ""
	help = "  Move    ^E up  ^X down  ^S left  ^D right  ^A/^F word"
	help = "          ^R/^C page   ^W/^Z scroll a line"
	help = "  Quick   ^Q S/D line ends   ^Q E/X screen   ^Q R/C file"
	help = "          ^Q F find  ^Q A replace  ^Q P last place  ^Q 0-9 marker"
	help = "  Delete  ^G char  ^T word  ^Y line   ^Q Y to end  ^Q Del to start"
	help = "  Block   ^K B begin  ^K K end   ^K C copy  ^K V move  ^K Y delete"
	help = "          ^K W write to file   ^K R read a file   ^Q B/K go to block"
	help = "          ^K G read the 2nd open file in at the cursor"
	help = "  Markers ^K 0-9 set   ^Q 0-9 go"
	help = "  Format  ^N split line  ^B reflow  ^O W wrap  ^O C center"
	help = "          ^O L/R margins   ^V overtype"
	help = "  Files   ^K S save  ^K D/X save and exit  ^K Q quit  ^L find again"
