name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Test
        run: make test CC=${{ matrix.cc }}

  sanitize:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        san: [asan, ubsan]
    steps:
      - uses: actions/checkout@v6
      - name: Run tests and torture under ${{ matrix.san }}
        run: make ${{ matrix.san }}

  torture:
    name: torture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Fuzz the parsers and regex engine
        run: make torture TORTURE_ROUNDS=200000

  # Single required status check for the branch ruleset. It passes only when
  # every other job passed, so the ruleset gates on this one name and the job
  # list can change without touching the ruleset.
  ci-ok:
    name: ci-ok
    needs: [build-test, sanitize, torture]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the required jobs succeeded
        run: |
          results="${{ needs.build-test.result }} ${{ needs.sanitize.result }} ${{ needs.torture.result }}"
          echo "results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
          echo "all required jobs passed"
