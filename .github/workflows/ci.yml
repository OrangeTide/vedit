name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# -v makes the test driver list every check, so a failing one is named here.
env:
  TAPFLAGS: -v

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Test
        run: make test CC=${{ matrix.cc }}

  sanitize:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        san: [asan, ubsan]
    steps:
      - uses: actions/checkout@v6
      - name: Run tests and torture under ${{ matrix.san }}
        run: make ${{ matrix.san }}

  torture:
    name: torture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Fuzz the parsers and regex engine
        run: make torture TORTURE_ROUNDS=200000

  # Cross-compile for other Linux architectures with the distro cross
  # toolchains, then run the test suite under qemu user-mode emulation.
  # qemu-user-binfmt registers the emulators with binfmt_misc, so the taptest
  # driver can exec the foreign test binaries as if they were native, and
  # QEMU_LD_PREFIX points qemu at the matching cross sysroot for ld.so.
  cross:
    name: cross (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            triplet: aarch64-linux-gnu
          - arch: armhf
            triplet: arm-linux-gnueabihf
          - arch: riscv64
            triplet: riscv64-linux-gnu
    env:
      QEMU_LD_PREFIX: /usr/${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v6
      - name: Install the cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.triplet }} qemu-user-binfmt
      - name: Build
        run: make CC=${{ matrix.triplet }}-gcc
      - name: Run the cross-built binary
        run: ./vedit --version
      - name: Test under qemu
        run: make test CC=${{ matrix.triplet }}-gcc

  # A static musl binary, the `make static` target, so the build that gets
  # dropped onto a server stays buildable.
  static:
    name: static (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: make static
      - name: Check that the binary is static
        run: |
          file vedit
          if ldd vedit 2>/dev/null; then echo "vedit is not static"; exit 1; fi
          ./vedit --version

  # The slimmer configurations: without the terminal panel, without the art
  # view, and without both (which also drops the VT emulator).
  no-term:
    name: slim (${{ matrix.flags }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        flags: ["VEDIT_NO_TERM=1", "VEDIT_NO_ART=1", "VEDIT_NO_TERM=1 VEDIT_NO_ART=1"]
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: make ${{ matrix.flags }}
      - name: Test
        run: make test ${{ matrix.flags }}

  # macOS: the pty code takes the <util.h> path there. The allocation-failure
  # test needs the GNU linker's --wrap, which Apple's ld lacks, so it is left
  # out and the other suites run directly.
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: make
      - name: Test
        run: |
          make tests/taptest tests/test_unit tests/test_render tests/test_term
          tests/taptest -v --self-test --exe tests/test_unit tests/test_render tests/test_term

  # The graphical build. The ubuntu-24.04 runners have no SDL3 package, so
  # it runs in a newer container that does; a link failure here means the
  # window binding drifted from the vendored guterm.h or the core.
  gvedit:
    name: gvedit
    runs-on: ubuntu-latest
    container: ubuntu:25.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the toolchain and SDL3
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libsdl3-dev
      - name: Build
        run: make gvedit
      - name: Check that it links and starts
        run: ./gvedit --version

  # The Windows build of gvedit: cross compiled with mingw against the SDL3
  # development package for mingw, then started under wine to check that it
  # links, loads SDL3.dll and gets through startup. The window itself is not
  # exercised; --version returns before it opens.
  gvedit-windows:
    name: gvedit-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 wine64
      - name: Fetch the SDL3 mingw development package
        id: sdl3
        uses: ./.github/actions/sdl3-mingw
      - name: Cross compile gvedit
        run: |
          SDL="${{ steps.sdl3.outputs.prefix }}"
          make gvedit CC=x86_64-w64-mingw32-gcc \
            SDL_CFLAGS="-I$SDL/include" \
            SDL_LIBS="-L$SDL/lib -lSDL3 -lmingw32 -mwindows"
          cp "$SDL/bin/SDL3.dll" _out/x86_64-w64-mingw32/bin/
      - name: Start it under wine
        run: WINEDEBUG=-all wine _out/x86_64-w64-mingw32/bin/gvedit.exe --version

  # gvedit as the release ships it for Linux: linked against a static SDL3
  # built from source on the oldest runner, so the binary runs without a
  # system libSDL3. Checks the link and that it starts.
  gvedit-static:
    name: gvedit-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build SDL3 static
        id: sdl3
        uses: ./.github/actions/sdl3-static
      - name: Build gvedit against it
        run: |
          export PKG_CONFIG_PATH="${{ steps.sdl3.outputs.prefix }}/lib/pkgconfig"
          make gvedit SDL_CFLAGS="$(pkg-config --cflags sdl3)" \
            SDL_LIBS="$(pkg-config --static --libs sdl3)"
          ldd gvedit
          if ldd gvedit | grep -q SDL3; then echo "gvedit links libSDL3 dynamically"; exit 1; fi
          ./gvedit --version

  # Single required status check for the branch ruleset. It passes only when
  # every other job passed, so the ruleset gates on this one name and the job
  # list can change without touching the ruleset.
  ci-ok:
    name: ci-ok
    needs: [build-test, sanitize, torture, cross, static, no-term, macos, gvedit, gvedit-windows, gvedit-static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the required jobs succeeded
        run: |
          results="${{ needs.build-test.result }} ${{ needs.sanitize.result }} ${{ needs.torture.result }} ${{ needs.cross.result }} ${{ needs.static.result }} ${{ needs.no-term.result }} ${{ needs.macos.result }} ${{ needs.gvedit.result }} ${{ needs.gvedit-windows.result }} ${{ needs.gvedit-static.result }}"
          echo "results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
          echo "all required jobs passed"
